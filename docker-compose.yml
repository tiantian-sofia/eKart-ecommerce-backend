version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ekart
      POSTGRES_USER: ekart
      POSTGRES_PASSWORD: ekart123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      dbUrl: jdbc:postgresql://postgres:5432/ekart
      dbUsername: ekart
      dbPassword: ekart123
      REDIS_HOST: redis
      jsonSecretKey: ekartSecretKey
      adminPassword: Admin@123
      stripeApiKey: sk_test_dummy
      stripeEndpointSecret: dummy
      emailUsername: dummy@gmail.com
      emailPassword: dummy
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
