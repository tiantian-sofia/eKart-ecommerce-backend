spring.application.name=ekart-ecommerce-backend

#Server Properties
server.port=8000

#Active Configuration Profile
spring.profiles.active=dev

#To resolve the reserved keywords issues with hibernate auto generated queries
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

#Swagger Configuration
#spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

#JWT Configuration
# Must be a Base64-encoded key of at least 256 bits (32 bytes) for HS256.
# Override in production via the jsonSecretKey environment variable.
jwt.secret.key=${jsonSecretKey:4u1ChBccGbf/9KZ9ph51V0lQpoKSUc1RmhZsHnQYdW0=}

#Admin Configuration
admin.password=${adminPassword:Admin@123}

stripeApiKey=${STRIPE_API_KEY:sk_test_dummy}
stripe.endpoint.secret=${STRIPE_ENDPOINT_SECRET:dummy}

# Server Compression Configuration
server.compression.enabled=true
server.compression.min-response-size=1024

#Caching Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=15m

#Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${emailUsername:dummy@gmail.com}
spring.mail.password=${emailPassword:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS Configuration
cors.allowed.origins=http://localhost:5173,https://ekart.vedasole.cloud,https://ekart-shopping.netlify.app,https://develop--ekart-shopping.netlify.app